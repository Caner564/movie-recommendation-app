<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommendation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Movie Recommendation</h1>
    </header>

<main>
    <h2>Filmler</h2>
    <div class="search-container">
    <input type="text" id="searchInput" placeholder="Film ara...">
    <button id="searchButton">Ara</button>
    </div>
    <div class="category-container">
    <label for="categorySelect">Kategori:</label>
    <select id="categorySelect">
        <option value="all">Tüm Filmler</option>
        <option value="Aksiyon">Aksiyon</option>
        <option value="Bilim Kurgu">Bilim Kurgu</option>
        <option value="Komedi">Komedi</option>
    </select>
</div>

<p id="no-results" style="display: none;">Film bulunamadı.</p>
    <div id="movie-list">
    </div>
</main>
    <script src="script.js"></script>
</body>
</html>
