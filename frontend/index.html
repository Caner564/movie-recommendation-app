<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommendation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
    <h1>Film Öneri Sistemi</h1>
    <button id="darkModeButton">🌙 Dark Mode</button>

    <div class="user-links">
    <a href="login.html">Giriş Yap</a>
    <a href="register.html">Kayıt Ol</a>
    <a href="favorites.html">Favorilerim</a>
    </div>
    </header>

<main>
    <h2>Filmler</h2>
    <div class="recommendation-container">
    <h2>Film Önerileri</h2>

    <select id="recommendationGenre">
    <option value="Aksiyon">Aksiyon</option>
    <option value="Bilim Kurgu">Bilim Kurgu</option>
    <option value="Komedi">Komedi</option>
    <option value="Romantik">Romantik</option>
    <option value="Korku">Korku</option>
    <option value="Drama">Drama</option>
    <option value="Animasyon">Animasyon</option>
</select>

    <button id="recommendButton">Öneri Getir</button>

    <div id="recommendation-list"></div>
    </div>
    <div class="search-container">
    <input type="text" id="searchInput" placeholder="Film ara...">
    <button id="searchButton">Ara</button>
    </div>
    <div class="category-container">
    <label for="categoryFilter">Kategori:</label>

    <select id="categoryFilter">
        <option value="all">Tüm Kategoriler</option>
        <option value="Aksiyon">Aksiyon</option>
        <option value="Bilim Kurgu">Bilim Kurgu</option>
        <option value="Komedi">Komedi</option>
        <option value="Romantik">Romantik</option>
        <option value="Korku">Korku</option>
        <option value="Drama">Drama</option>
        <option value="Animasyon">Animasyon</option>
    </select>
</div>

<p id="no-results" style="display: none;">Film bulunamadı.</p>
    <div id="movie-list">
    </div>
</main>
    <script src="script.js"></script>
</body>
</html>
